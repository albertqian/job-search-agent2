name: Job Leads — Daily Email

on:
  schedule:
    - cron: "0 16 * * 1-5"

  workflow_dispatch:

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape, score, and generate cover letters
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python job_scraper.py

      - name: Send email digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          TO_ADDRESS:     ${{ secrets.TO_ADDRESS }}
        run: python send_email.py

      - name: Commit seen_urls.json
        run: |
          echo "Skipping commit — PAT issue being resolved separately"
